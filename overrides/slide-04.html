<style>
#s4{--gold:#C9A84C;--navy:#0B1A2E}

#s4 .L::after{content:'';position:absolute;top:0;bottom:0;right:0;width:230px;pointer-events:none;

#s4 .R{position:absolute;left:902px;top:0;right:0;height:100%;background:#F4F1EA;z-index:2}

#s4 .ttl{position:absolute;left:64px;top:72px;z-index:3;

#s4 .hr{position:absolute;left:64px;width:764px;top:152px;height:1px;z-index:3;

/* ---- left: people ---- */

#s4 .role{margin-top:26px;font:700 15px/1 'Noto Sans JP',sans-serif;
  color:var(--gold);letter-spacing:.17em}
#s4 .name{margin-top:15px;font:700 27px/1.2 'Noto Sans JP',sans-serif;color:#fff}
#s4 .cred{margin-top:12px;font:400 15px/1.55 'Noto Sans JP',sans-serif;

/* ---- left: book ---- */
#s4 .book{position:absolute;left:26px;top:612px;width:286px;height:394px;z-index:3;

#s4 .bk .bt{margin-top:52px;font:700 37px/1.42 'Noto Sans JP',sans-serif;

#s4 .bk .bd{margin-top:44px;font:400 15px/1.7 'Noto Sans JP',sans-serif;
  color:rgba(255,255,255,.58);text-align:center}

/* ---- right ---- */
#s4 .rh{position:absolute;left:64px;top:80px;
  font:700 40px/1.15 'Noto Sans JP',sans-serif;color:var(--navy);letter-spacing:.01em}
#s4 .rs{position:absolute;left:64px;top:138px;

#s4 .rrule{position:absolute;left:64px;top:196px;width:78px;height:3px;background:var(--gold)}
#s4 .grid{position:absolute;left:56px;right:52px;top:248px;bottom:112px;
  display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);
  column-gap:22px;row-gap:14px}
#s4 .cell{display:flex;align-items:center;justify-content:center}
/* the source logos are opaque white PNGs — multiply drops the white box onto the cream */
#s4 .cell img{max-width:168px;max-height:60px;width:auto;height:auto;
  object-fit:contain;display:block;mix-blend-mode:multiply}
#s4 .more{font:700 24px/1 'Noto Sans JP',sans-serif;color:var(--gold);letter-spacing:.05em}
